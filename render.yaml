services:
  - type: web
    name: zstore-jsp
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DB_HOST
        value: gateway01.ap-southeast-1.prod.aws.tidbcloud.com
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: zstore_jsp
      - key: DB_USER
        value: 2YwCNykgsBcN7yV.root
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: SUMOPOD_BASE_URL
        value: https://api-pay-sandbox.sumopod.com
      - key: SUMOPOD_API_KEY
        sync: false
      - key: SUMOPOD_WEBHOOK_TOKEN
        sync: false
      - key: PAYMENT_DEBUG_MODE
        value: "true"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-southeast-1
      - key: AWS_S3_BUCKET
        value: zapstore
