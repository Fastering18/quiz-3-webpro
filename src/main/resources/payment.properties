# Sumopod Managed Payment (QRIS) Configuration
# For local sandbox secrets without committing to Git, copy this file to
# src/main/resources/payment.local.properties or set environment variables:
# SUMOPOD_BASE_URL, SUMOPOD_API_KEY, SUMOPOD_WEBHOOK_TOKEN, PAYMENT_DEBUG_MODE

sumopod.base_url=https://api-pay-sandbox.sumopod.com
sumopod.api_key=
sumopod.webhook_token=

# Debug mode enables local sandbox status simulation controls on the invoice page
payment.debug_mode=true
payment.expire_minutes=60
